<!--
====================================================================
 MUSE向け 仕様書（このファイルを更新するときはここを読む）
====================================================================
 さわる場所は3つだけ。<script id="app"> の中は基本さわらなくてよい。

 【1】設定  <script id="state">  …  JSON
   count      いまの生き物の数（整数）
   species[]  種類のリスト
       name      種類名（【2】の絵の data-name と同じ文字にする）
       nickname  その種類の代表の1匹につく名前（なくてもよい）
       unlock    何匹目から登場するか
       size      体の大きさ（10〜45くらい。絵の縦横比に関係なく面積でそろう）
       speed     泳ぐ速さ（0.3〜2）
       shape, color, color2, pattern
                 【2】に絵がないときだけ使う予備の見た目
                 shape = fish | round | long | jelly | big
                 pattern = none | stripe | spots
   theme      海の色（すべて省略可）
       water  [上, 中, 下] の3色     sand  砂     hill  遠くの岩山
       weed   [海藻の色, 海藻の色]   coral [サンゴの色, サンゴの色]
   history[]  「これまでの軌跡」の1日分
       day, date("2026-11-16"), followers, count, title, text,
       new["種類名「なまえ」", …], reel(リールのURL)
       ※ new に書いた種類名に絵があれば、ノートにシールとして貼られる

 【2】生き物の絵  <div id="art">  の中に <svg> を1つ足す
   <svg data-name="種類名" viewBox="0 0 240 120"> … </svg>
   ルール
     ・頭を右に向けて描く（左向きは自動で反転する）
     ・viewBox いっぱいに体を描く。余白は上下左右 4〜10 くらい
     ・泳ぐ動きは自動でつく。しっぽを曲げた絵にしない（まっすぐ描く）
     ・script、外部画像、<text> は使わない。id を使うなら他の絵と重ならない名前に
   絵柄をそろえるための決まり
     ・輪郭線  stroke="#16263a"  stroke-width="4"  角は round
     ・色はベタ塗り2〜3色（背中の色、おなかの明るい色、差し色）。グラデーションなし
     ・目は白丸(r=6)に黒目(r=2.6)。小さく、前のほうに
     ・影やぼかしは使わない
   動きの調整（svgタグに足す。省略可）
     data-wiggle="1"   くねりの強さ（0=動かない、細長い魚は3〜4）
     data-waves="1"    体に入る波の数（ウナギやリュウグウノツカイは2以上）
     data-motion="pulse"  クラゲのようにふわふわ上下する動きにする

 【3】新しい種類を足す手順
   1. 【2】に絵を足す  2. species に1行足す（name を絵と同じに）
   3. count を増やす   4. history にその日の記録を足す
====================================================================
-->

<style id="appstyle">
:root{
  /* 一枚の水槽の上に、紙のラベルと観察ノートを重ねる */
  --ink:#16263a; --paper:#eef3f5; --rule:#bcd3de; --stamp:#c8483c; --deep:#0b2c4a; --foam:#ffffff;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --hand:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--deep);font-family:var(--display);color:var(--foam)}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;padding:16px 16px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:10;text-shadow:0 2px 0 rgba(11,44,74,.55)}
#title{font-size:21px;font-weight:900;letter-spacing:.04em}
#sub{font-family:var(--hand);font-weight:600;font-size:12.5px;margin-top:4px;max-width:14em;line-height:1.5;text-wrap:balance}
#count{font-size:46px;font-weight:900;line-height:.95;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
#count small{font-size:15px;font-weight:700;margin-left:2px}
#count .note{font-family:var(--hand);font-size:10.5px;font-weight:600;margin-top:6px}
#legend{position:fixed;left:0;right:0;bottom:60px;padding:0 16px;display:flex;gap:8px;overflow-x:auto;z-index:10;scrollbar-width:none}
#legend::-webkit-scrollbar{display:none}
.tag{flex:none;display:flex;align-items:center;gap:7px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:4px 10px 10px 4px;padding:3px 10px 3px 7px;font-family:var(--hand);font-weight:600;font-size:12px;line-height:1.25}
.tag img{height:20px;width:auto;max-width:54px;display:block}
.tag em{font-style:normal;display:block;font-size:10.5px;opacity:.7}
.tag.locked{background:transparent;color:var(--foam);border:2px dashed rgba(255,255,255,.6)}
#histBtn{position:fixed;right:16px;bottom:14px;z-index:11;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-left:8px solid var(--stamp);border-radius:4px;padding:8px 14px 8px 10px;font-family:var(--hand);font-weight:600;font-size:14px;cursor:pointer;box-shadow:3px 3px 0 rgba(11,44,74,.5)}
#histBtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(11,44,74,.5)}
#histBtn:focus-visible,#hclose:focus-visible,.reel:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
#histPanel{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(6,24,42,.6)}
#histPanel.open{display:flex}
.note-book{position:relative;width:min(560px,100%);max-height:90%;overflow-y:auto;color:var(--ink);font-family:var(--hand);
  background-color:var(--paper);
  background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:20px 20px;border:2px solid var(--ink);border-bottom:none;border-radius:6px 6px 0 0;padding:0 18px 26px 18px}
.nb-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;background:var(--ink);color:var(--paper);margin:0 -18px;padding:14px 18px 12px}
.nb-head small{display:block;font-size:11px;letter-spacing:.2em;opacity:.75}
.nb-head h2{font-size:21px;font-weight:600;letter-spacing:.06em}
#hclose{flex:none;background:none;color:var(--paper);border:1.5px solid var(--paper);border-radius:4px;font-family:var(--hand);font-weight:600;font-size:13px;padding:4px 12px;cursor:pointer}
.entry{position:relative;padding:22px 0 20px;border-bottom:2px dashed rgba(22,38,58,.35)}
.entry:last-child{border-bottom:none}
.when{font-size:12.5px;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.entry h3{font-size:19px;font-weight:600;line-height:1.4;margin-top:2px;padding-right:74px;text-wrap:balance}
.entry h3 span{background:linear-gradient(transparent 62%,rgba(255,209,102,.75) 62%)}
.stamp{position:absolute;right:2px;top:16px;width:60px;height:60px;border:2.5px solid var(--stamp);border-radius:50%;color:var(--stamp);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-9deg);font-family:var(--display);font-weight:900;line-height:1;opacity:.88}
.stamp:before{content:"";position:absolute;inset:3px;border:1px solid var(--stamp);border-radius:50%}
.stamp small{font-size:9.5px;letter-spacing:.14em}
.stamp b{font-size:24px}
.nums{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:13px}
.nums b{font-family:var(--display);font-weight:900;font-size:19px;margin:0 2px;font-variant-numeric:tabular-nums}
.entry p{font-size:14.5px;line-height:1.85;margin-top:8px;max-width:32em}
.stickers{display:flex;flex-wrap:wrap;gap:14px 12px;margin-top:14px}
.sticker{position:relative;background:#fff;border:1.5px solid var(--ink);padding:10px 8px 6px;width:104px;text-align:center;box-shadow:2px 2px 0 rgba(22,38,58,.22)}
.sticker:nth-child(odd){transform:rotate(-2.2deg)}
.sticker:nth-child(even){transform:rotate(1.8deg)}
.sticker:before{content:"";position:absolute;left:50%;top:-8px;width:40px;height:14px;margin-left:-20px;background:rgba(255,209,102,.8);transform:rotate(-3deg)}
.sticker img{display:block;margin:0 auto;max-width:84px;max-height:44px;width:auto;height:44px;object-fit:contain}
.sticker figcaption{font-size:10.5px;line-height:1.35;margin-top:5px}
.sticker figcaption b{display:block;font-size:14px;font-weight:600}
.reel{display:inline-block;margin-top:14px;color:var(--ink);font-weight:600;font-size:13.5px;text-decoration:underline;text-decoration-color:var(--stamp);text-decoration-thickness:2px;text-underline-offset:4px}
.hempty{font-size:14px;padding:20px 0}
@media (min-width:640px){
  #title{font-size:26px} #sub{font-size:14px;max-width:none} #count{font-size:60px}
  #histPanel{align-items:center}
  .note-book{border-bottom:2px solid var(--ink);border-radius:6px;max-height:86%}
}
</style>
</head>

<script id="app">
(function(){
var MAX_DRAW=400, INK='#16263a', K=2.3;
var state=JSON.parse(document.getElementById('state').textContent);
var TH={water:['#3aa0b4','#17698a','#0b2c4a'],sand:'#d8c391',hill:'#0f4763',weed:['#1c7f6c','#35a57c'],coral:['#ee8475','#f3b765']};
for(var tk in (state.theme||{})) TH[tk]=state.theme[tk];
var REDUCE=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function el(tag,attrs,html){var e=document.createElement(tag);for(var k in (attrs||{}))e.setAttribute(k,attrs[k]);if(html!=null)e.innerHTML=html;return e;}
function $(id){return document.getElementById(id);}
function rnd(a,b){return a+Math.random()*(b-a);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function shade(hex,amt){var n=parseInt(String(hex).slice(1),16);if(isNaN(n))return hex;
  var r=Math.min(255,Math.max(0,(n>>16)+amt)),g=Math.min(255,Math.max(0,((n>>8)&255)+amt)),b=Math.min(255,Math.max(0,(n&255)+amt));
  return 'rgb('+r+','+g+','+b+')';}

var cv=el('canvas'); document.body.appendChild(cv); var ctx=cv.getContext('2d');
document.body.appendChild(el('div',{id:'hud'},'<div><div id="title"></div><div id="sub"></div></div><div id="count"></div>'));
var legend=el('div',{id:'legend'}); document.body.appendChild(legend);
var histBtn=el('button',{id:'histBtn',type:'button'},'これまでの軌跡'); document.body.appendChild(histBtn);
var histPanel=el('div',{id:'histPanel'}); document.body.appendChild(histPanel);

/* ---------- 絵の読みこみ ---------- */
var XS='xmlns="http://www.w3.org/2000/svg"';
function genericSVG(s){
  var c1=s.color||'#8fb8d0', c2=s.color2||'#f2f8fb', dk=shade(c1,-28), sh=s.shape||'fish';
  var g='<g stroke="'+INK+'" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">', eye=function(x,y){return '<circle cx="'+x+'" cy="'+y+'" r="6" fill="#fff" stroke-width="3"/><circle cx="'+(x+1.5)+'" cy="'+y+'" r="2.6" fill="'+INK+'" stroke="none"/>';};
  var pat=function(cx,cy,rx){ if(s.pattern==='stripe') return '<g fill="'+c2+'" stroke="none" clip-path="url(#gc)"><rect x="'+(cx-rx*.5)+'" y="0" width="'+rx*.16+'" height="200"/><rect x="'+(cx-rx*.05)+'" y="0" width="'+rx*.16+'" height="200"/><rect x="'+(cx+rx*.38)+'" y="0" width="'+rx*.14+'" height="200"/></g>';
    if(s.pattern==='spots'){var o='<g fill="'+c2+'" stroke="none">';for(var i=0;i<6;i++)o+='<circle cx="'+(cx-rx*.6+i*rx*.22)+'" cy="'+(cy+(i%2?-8:6))+'" r="4"/>';return o+'</g>';} return '';};
  if(sh==='jelly') return {vb:[0,0,120,170],motion:'pulse',svg:'<svg '+XS+' viewBox="0 0 120 170">'+g+
    '<path d="M30 70 C26 100 36 120 28 150 M50 72 C46 104 56 126 50 160 M70 72 C74 104 64 126 70 160 M90 70 C94 100 84 120 92 150" fill="none" stroke="'+dk+'" stroke-width="5"/>'+
    '<path d="M10 70 C10 20 110 20 110 70 C96 78 84 64 72 72 C64 78 54 64 46 72 C36 78 24 64 10 70 Z" fill="'+c1+'"/><ellipse cx="42" cy="40" rx="12" ry="6" fill="'+c2+'" stroke="none"/></g></svg>'};
  if(sh==='round') return {vb:[0,0,200,150],svg:'<svg '+XS+' viewBox="0 0 200 150"><clipPath id="gc"><circle cx="112" cy="75" r="62"/></clipPath>'+g+
    '<path d="M54 75 L12 48 C8 66 8 84 12 102 Z" fill="'+dk+'"/><circle cx="112" cy="75" r="62" fill="'+c1+'"/><path d="M56 96 C80 150 150 150 170 96 C130 112 90 112 56 96 Z" fill="'+c2+'" stroke="none"/>'+pat(112,60,62)+'<circle cx="112" cy="75" r="62" fill="none"/><path d="M104 84 C96 104 82 106 76 100 C86 96 92 88 94 82 Z" fill="'+dk+'"/>'+eye(150,58)+'</g></svg>'};
  if(sh==='long'||sh==='big'){var H=sh==='big'?150:110, cy=H/2, ry=sh==='big'?52:30;
    return {vb:[0,0,300,H],wiggle:.8,svg:'<svg '+XS+' viewBox="0 0 300 '+H+'"><clipPath id="gc"><ellipse cx="170" cy="'+cy+'" rx="122" ry="'+ry+'"/></clipPath>'+g+
    '<path d="M60 '+cy+' L12 '+(cy-ry-6)+' C22 '+(cy-10)+' 22 '+(cy+10)+' 12 '+(cy+ry+6)+' Z" fill="'+dk+'"/><path d="M150 '+(cy-ry+2)+' L168 '+(cy-ry-18)+' C180 '+(cy-ry-10)+' 186 '+(cy-ry-2)+' 190 '+(cy-ry+2)+' Z" fill="'+dk+'"/>'+
    '<ellipse cx="170" cy="'+cy+'" rx="122" ry="'+ry+'" fill="'+c1+'"/><ellipse cx="180" cy="'+(cy+ry*.9)+'" rx="120" ry="'+ry*.7+'" fill="'+c2+'" stroke="none" clip-path="url(#gc)"/>'+pat(170,cy-6,122)+
    '<ellipse cx="170" cy="'+cy+'" rx="122" ry="'+ry+'" fill="none"/><path d="M200 '+(cy+ry*.6)+' C192 '+(cy+ry+18)+' 176 '+(cy+ry+22)+' 168 '+(cy+ry+18)+' C178 '+(cy+ry+8)+' 184 '+(cy+ry*.8)+' 186 '+(cy+ry*.6)+' Z" fill="'+dk+'"/>'+eye(262,cy-8)+'</g></svg>'};}
  return {vb:[0,0,240,130],svg:'<svg '+XS+' viewBox="0 0 240 130"><clipPath id="gc"><ellipse cx="138" cy="65" rx="90" ry="44"/></clipPath>'+g+
    '<path d="M58 65 L12 30 C20 54 20 76 12 100 Z" fill="'+dk+'"/><path d="M110 24 C122 4 150 6 162 24 Z" fill="'+dk+'"/><ellipse cx="138" cy="65" rx="90" ry="44" fill="'+c1+'"/>'+
    '<ellipse cx="146" cy="104" rx="90" ry="34" fill="'+c2+'" stroke="none" clip-path="url(#gc)"/>'+pat(138,58,90)+'<ellipse cx="138" cy="65" rx="90" ry="44" fill="none"/>'+
    '<path d="M150 78 C142 98 126 100 120 94 C130 90 136 82 138 76 Z" fill="'+dk+'"/>'+eye(198,54)+'</g></svg>'};
}
var sprites={};
function loadSprite(s){
  if(sprites[s.name]) return;
  var sp={ready:false,waves:1,wiggle:1,motion:'swim',levels:[]}, src, vb;
  var arts=document.querySelectorAll('#art svg'), found=null;
  for(var i=0;i<arts.length;i++) if(arts[i].getAttribute('data-name')===s.name) found=arts[i];
  if(found){
    var c=found.cloneNode(true); vb=(c.getAttribute('viewBox')||'0 0 240 120').trim().split(/[\s,]+/).map(Number);
    c.setAttribute('width',vb[2]); c.setAttribute('height',vb[3]);
    src=new XMLSerializer().serializeToString(c);
    if(c.hasAttribute('data-waves')) sp.waves=Number(c.getAttribute('data-waves'))||1;
    if(c.hasAttribute('data-wiggle')) sp.wiggle=Number(c.getAttribute('data-wiggle'));
    if(c.getAttribute('data-motion')==='pulse') sp.motion='pulse';
  } else {
    var g=genericSVG(s); vb=g.vb; src=g.svg.replace('<svg ','<svg width="'+vb[2]+'" height="'+vb[3]+'" ');
    if(g.motion) sp.motion=g.motion; if(g.wiggle!=null) sp.wiggle=g.wiggle;
  }
  sp.aspect=vb[2]/vb[3];
  sp.uri='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(src);
  sprites[s.name]=sp;
  var img=new Image();
  img.onload=function(){
    var w=Math.min(700,Math.ceil(K*(s.size||12)*1.2*Math.sqrt(sp.aspect)*DPR)), h=Math.ceil(w/sp.aspect);
    for(var L=0;L<3;L++){
      var sc=DEPTH[L].scale, c=document.createElement('canvas'); c.width=Math.max(4,Math.ceil(w*sc)); c.height=Math.max(4,Math.ceil(h*sc));
      var x=c.getContext('2d'); x.drawImage(img,0,0,c.width,c.height);
      if(DEPTH[L].tint){x.globalCompositeOperation='source-atop'; x.globalAlpha=DEPTH[L].tint; x.fillStyle=TH.water[1]; x.fillRect(0,0,c.width,c.height);}
      sp.levels.push(c);
    }
    sp.ready=true;
  };
  img.src=sp.uri;
}
var DEPTH=[{scale:.6,tint:.52,speed:.6},{scale:.8,tint:.26,speed:.8},{scale:1,tint:0,speed:1}];

/* ---------- 魚 ---------- */
var W=0,H=0,DPR=1,fishes=[],bubbles=[],t0=performance.now(),decor;
function buildDecor(){
  decor={weeds:[],corals:[],pebbles:[],plank:[],h1:rnd(0,9),h2:rnd(0,9)};
  var nw=Math.max(7,Math.round(W/70));
  for(var j=0;j<nw;j++)decor.weeds.push({x:rnd(8,W-8),h:rnd(50,Math.min(170,H*.24)),n:2+Math.floor(rnd(0,3)),ph:rnd(0,6.28),c:j%2});
  var nc=Math.max(3,Math.round(W/260));
  for(var k=0;k<nc;k++){var br=[],nb=4+Math.floor(rnd(0,3));for(var b=0;b<nb;b++)br.push({dx:(b-(nb-1)/2)*rnd(9,13),dy:rnd(18,44),r:rnd(5,9)});
    decor.corals.push({x:rnd(30,W-30),c:k%2,br:br});}
  for(var p=0;p<Math.round(W/26);p++)decor.pebbles.push({x:rnd(0,W),y:rnd(6,26),r:rnd(1.5,4)});
  for(var q=0;q<36;q++)decor.plank.push({x:rnd(0,W),y:rnd(0,H),r:rnd(.8,1.8),v:rnd(2,6),ph:rnd(0,6.28)});
}
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);buildDecor();}
window.addEventListener('resize',resize); resize();
function swimTop(){return Math.min(H*.2,120)+10;} function swimBottom(){return H-58;}

function sortedSpecies(){return (state.species||[]).slice().sort(function(a,b){return (a.unlock||1)-(b.unlock||1);});}
function speciesFor(i){var sp=sortedSpecies(),r=sp[0];for(var k=0;k<sp.length;k++){if((sp[k].unlock||1)<=i)r=sp[k];}return r;}
function makeFish(i){
  var s=speciesFor(i)||{name:'?',size:12,speed:1};
  var star=!!(s.nickname && i===(s.unlock||1));
  var lv=star?2:(Math.random()<.38?0:(Math.random()<.55?1:2));
  var y=rnd(swimTop(),swimBottom());
  return {i:i,s:s,star:star,lv:lv,mul:star?1.18:rnd(.85,1.12),dir:Math.random()<.5?-1:1,
    x:rnd(0,W),y:y,baseY:y,v:(s.speed||1)*rnd(.7,1.2)*24*DEPTH[lv].speed,ph:rnd(0,6.28)};
}
function syncFish(){
  var n=Math.max(0,Math.floor(state.count||0)), want=Math.min(n,MAX_DRAW), next=[], sp=sortedSpecies();
  for(var k=1;k<=want;k++){ var i=n>MAX_DRAW?Math.round(k*n/want):k; if(k===want&&n>MAX_DRAW)i=n; next.push(makeFish(i)); }
  // 解放済みの種類は、名前つきの代表を必ず1匹出す
  sp.forEach(function(s,idx){ if(n>=(s.unlock||1) && next.length && !next.some(function(f){return f.s===s&&(f.star||!s.nickname);})){
    next[Math.min(next.length-1,idx*7)]=makeFish(s.unlock||1); }});
  fishes=next.sort(function(a,b){return a.lv-b.lv;});
  sp.forEach(loadSprite);
}

/* ---------- 背景 ---------- */
function hills(base,amp,seed,color){
  ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(0,H);
  for(var x=0;x<=W+20;x+=20){ctx.lineTo(x,base-amp*(.55+.45*Math.sin(x*.0061+seed))*(.6+.4*Math.sin(x*.017+seed*2.3)));}
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
}
function background(t){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,TH.water[0]); g.addColorStop(.45,TH.water[1]); g.addColorStop(1,TH.water[2]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // 水面のゆらぎ
  ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=3; ctx.lineCap='round';
  for(var r=0;r<3;r++){var yy=10+r*13; ctx.beginPath();
    for(var x=-20;x<=W+20;x+=16){var y=yy+Math.sin(x*.02+t*(.5+r*.2)+r*2)*4; if(x===-20)ctx.moveTo(x,y); else ctx.lineTo(x,y);} ctx.stroke();}
  ctx.globalAlpha=.55; hills(H-40,H*.2,decor.h1,TH.hill); ctx.globalAlpha=1;
  hills(H-34,H*.1,decor.h2,shade(TH.hill,-14));
  ctx.fillStyle='rgba(255,255,255,.4)';
  for(var p=0;p<decor.plank.length;p++){var pl=decor.plank[p], py=(pl.y-t*pl.v)%(H+10); if(py<0)py+=H+10;
    ctx.beginPath(); ctx.arc(pl.x+Math.sin(t*.4+pl.ph)*8,py,pl.r,0,6.2832); ctx.fill();}
}
function sandY(x){return H-36-Math.sin(x*.012)*6-Math.sin(x*.041)*3;}
function foreground(t){
  var i,j,b;
  for(i=0;i<decor.weeds.length;i++){var wd=decor.weeds[i]; ctx.fillStyle=TH.weed[wd.c];
    for(b=0;b<wd.n;b++){var bx=wd.x+(b-(wd.n-1)/2)*11, hh=wd.h*(.65+((b*37)%10)/22), sw=Math.sin(t*.9+wd.ph+b*.8)*hh*.16, by=H-22;
      ctx.beginPath(); ctx.moveTo(bx-5,by);
      ctx.quadraticCurveTo(bx-7+sw*.3,by-hh*.55,bx+sw,by-hh);
      ctx.quadraticCurveTo(bx+8+sw*.3,by-hh*.5,bx+5,by); ctx.closePath(); ctx.fill();}}
  for(i=0;i<decor.corals.length;i++){var co=decor.corals[i], cy=H-24; ctx.strokeStyle=ctx.fillStyle=TH.coral[co.c]; ctx.lineWidth=6; ctx.lineCap='round';
    for(j=0;j<co.br.length;j++){var q=co.br[j]; ctx.beginPath(); ctx.moveTo(co.x+q.dx*.3,cy); ctx.lineTo(co.x+q.dx,cy-q.dy); ctx.stroke();
      ctx.beginPath(); ctx.arc(co.x+q.dx,cy-q.dy,q.r,0,6.2832); ctx.fill();}}
  ctx.fillStyle=TH.sand; ctx.beginPath(); ctx.moveTo(0,H);
  for(var x=0;x<=W+18;x+=18)ctx.lineTo(x,sandY(x)); ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  ctx.fillStyle=shade(TH.sand,-34);
  for(i=0;i<decor.pebbles.length;i++){var pb=decor.pebbles[i]; ctx.beginPath(); ctx.ellipse(pb.x,H-pb.y,pb.r*1.4,pb.r,0,0,6.2832); ctx.fill();}
}
function drawBubbles(dt){
  if(bubbles.length<26 && Math.random()<.12) bubbles.push({x:rnd(0,W),y:H-30,r:rnd(2,5),v:rnd(22,50)});
  ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=1.5;
  for(var i=bubbles.length-1;i>=0;i--){var b=bubbles[i]; b.y-=b.v*dt; b.x+=Math.sin(b.y*.05)*.3;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.2832); ctx.stroke(); if(b.y<-10)bubbles.splice(i,1);}
}

/* ---------- 魚を描く（絵を細く切って波うたせる） ---------- */
function drawFish(f,t){
  var sp=sprites[f.s.name]; if(!sp||!sp.ready) return;
  var img=sp.levels[f.lv], w=K*(f.s.size||12)*f.mul*Math.sqrt(sp.aspect)*DEPTH[f.lv].scale, h=w/sp.aspect;
  f.w=w; f.h=h;
  ctx.save(); ctx.translate(f.x,f.y);
  if(sp.motion==='pulse'){var p=1+Math.sin(t*2+f.ph)*.07; ctx.scale(p,1/p); ctx.drawImage(img,-w/2,-h/2,w,h);}
  else{
    ctx.scale(f.dir,1);
    var N=Math.max(6,Math.min(30,Math.round(w/5))), sw=img.width/N, dw=w/N, amp=h*.085*sp.wiggle, fq=5.2*(f.s.speed||1);
    if(REDUCE||!amp){ctx.drawImage(img,-w/2,-h/2,w,h);}
    else for(var i=0;i<N;i++){var u=1-(i+.5)/N, off=Math.sin(t*fq+f.ph-u*sp.waves*6.2832)*amp*(.12+.88*u);
      ctx.drawImage(img,i*sw,0,sw,img.height,-w/2+i*dw,-h/2+off,dw+.7,h);}
  }
  ctx.restore();
}
function drawTag(f){
  if(!f.star||!f.h) return;
  var label=f.s.nickname; ctx.font='600 12.5px "Klee One","Hiragino Maru Gothic ProN",sans-serif';
  var tw=ctx.measureText(label).width+16, x=Math.max(tw/2+4,Math.min(W-tw/2-4,f.x)), y=f.y-f.h/2-26;
  ctx.strokeStyle=INK; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(x,y+19); ctx.lineTo(f.x,f.y-f.h/2+2); ctx.stroke();
  ctx.fillStyle='#eef3f5'; ctx.beginPath(); ctx.rect(x-tw/2,y,tw,20); ctx.fill(); ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle=INK; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(label,x,y+10.5);
}

var last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000); last=now; var t=(now-t0)/1000, i, f;
  background(t);
  for(i=0;i<fishes.length;i++){f=fishes[i]; var sp=sprites[f.s.name];
    if(sp&&sp.motion==='pulse'){f.y=f.baseY+Math.sin(t*.5+f.ph)*34; f.x+=Math.sin(t*.2+f.ph)*.25;}
    else{f.x+=f.dir*f.v*dt; f.y=f.baseY+Math.sin(t*1.1+f.ph)*6;
      var m=(f.w||60)*.5+20; if(f.x>W+m){f.dir=-1;f.baseY=rnd(swimTop(),swimBottom());} if(f.x<-m){f.dir=1;f.baseY=rnd(swimTop(),swimBottom());}}
    drawFish(f,t);}
  foreground(t); drawBubbles(dt);
  for(i=0;i<fishes.length;i++) drawTag(fishes[i]);
  if(!REDUCE) requestAnimationFrame(frame); else setTimeout(function(){requestAnimationFrame(frame);},400);
}

/* ---------- 画面の文字 ---------- */
function renderHud(){
  $('title').textContent=state.title||'フォロワー水族館'; document.title=state.title||'フォロワー水族館';
  $('sub').textContent=state.subtitle||'';
  var n=Math.max(0,Math.floor(state.count||0));
  $('count').innerHTML=n.toLocaleString()+'<small>匹</small>'+(n>MAX_DRAW?'<div class="note">画面には'+MAX_DRAW+'匹まで</div>':'');
  var sp=sortedSpecies(), h='', nextShown=false;
  for(var i=0;i<sp.length;i++){var s=sp[i], ok=n>=(s.unlock||1);
    if(!ok){ if(nextShown)break; nextShown=true; h+='<span class="tag locked">つぎの仲間まで あと'+((s.unlock||1)-n)+'人</span>'; }
    else h+='<span class="tag"><img alt="" src="'+sprites[s.name].uri+'"><span>'+esc(s.name)+(s.nickname?'<em>'+esc(s.nickname)+'</em>':'')+'</span></span>';}
  legend.innerHTML=h;
}
function renderHistory(){
  var h=state.history||[], html='<div class="note-book" role="dialog" aria-label="これまでの軌跡"><div class="nb-head"><div><small>'+esc(state.title||'')+'　観察ノート</small><h2>これまでの軌跡</h2></div><button id="hclose" type="button">とじる</button></div>';
  if(!h.length) html+='<p class="hempty">まだ記録がありません。</p>';
  for(var i=0;i<h.length;i++){var e=h[i];
    html+='<article class="entry">';
    if(e.day) html+='<div class="stamp"><small>DAY</small><b>'+esc(e.day)+'</b></div>';
    html+='<div class="when">'+esc(String(e.date||'').replace(/-/g,'.'))+'</div>';
    if(e.title) html+='<h3><span>'+esc(e.title)+'</span></h3>';
    if(e.followers!=null||e.count!=null){html+='<div class="nums">';
      if(e.followers!=null) html+='<span>フォロワー<b>'+esc(e.followers)+'</b>人</span>';
      if(e.count!=null) html+='<span>生き物<b>'+esc(e.count)+'</b>匹</span>'; html+='</div>';}
    if(e.text) html+='<p>'+esc(e.text)+'</p>';
    if(e.new&&e.new.length){html+='<div class="stickers">';
      for(var j=0;j<e.new.length;j++){var m=/^(.+?)「(.+)」$/.exec(e.new[j]), nm=m?m[1]:e.new[j], nick=m?m[2]:'', sp=sprites[nm];
        html+='<figure class="sticker">'+(sp?'<img alt="" src="'+sp.uri+'">':'')+'<figcaption>'+(nick?'<b>'+esc(nick)+'</b>':'')+esc(nm)+'</figcaption></figure>';}
      html+='</div>';}
    if(e.reel) html+='<a class="reel" href="'+esc(e.reel)+'" target="_blank" rel="noopener">この日のリールを見る →</a>';
    html+='</article>';}
  histPanel.innerHTML=html+'</div>';
  $('hclose').onclick=function(){histPanel.classList.remove('open');};
}
histBtn.onclick=function(){histPanel.classList.add('open');};
histPanel.addEventListener('click',function(ev){if(ev.target===histPanel)histPanel.classList.remove('open');});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape')histPanel.classList.remove('open');});

syncFish(); renderHud(); renderHistory(); requestAnimationFrame(frame);
})();
</script>
